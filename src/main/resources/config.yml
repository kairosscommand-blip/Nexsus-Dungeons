# NexusDungeons configuration.
#
# The core idea: /dungeons create carves a genuinely huge, real, solid-walled maze underground --
# corridors, dead ends, traps, treasure, prison cells, and a boss guarding the best loot at the
# very end -- spread across many ticks so it never freezes the server, and protected block-by-block
# forever after so it can never be tunneled, blown, or bucketed through. See README for the full
# picture of how a dungeon is put together.

generation:
  # Real block edits per tick spent carving. Higher finishes a dungeon faster but risks visible
  # lag on a busy server; lower is gentler but takes longer to finish generating. A default 61x61,
  # 3-floor dungeon is on the order of a few million block edits total -- expect real minutes, not
  # seconds, for "the biggest we can make it" sizes.
  blocks-per-tick: 6000

  # /dungeons create <name> [floors] [cellSize] -- these are the values used when the admin
  # doesn't specify one. cellSize is always forced to the nearest odd number (keeps the grid's
  # center column, the default entrance row, perfectly centered).
  default-floors: 3
  default-cells: 61

  # Hard ceilings /dungeons create clamps to, regardless of what an admin asks for -- a safety net
  # against an accidental /dungeons create MyDungeon 50 999 taking down the server.
  max-floors: 6
  max-cells: 141

  # Real blocks: how wide a corridor is, how thick the rock between two corridors is, and how
  # tall a room is (floor slab and ceiling slab are each wall-thickness blocks on top of this).
  corridor-width: 3
  wall-thickness: 2
  floor-height: 4

  # Chance, per pair of not-already-linked neighboring cells, that an extra passage is knocked
  # through anyway -- turns part of what would otherwise be one single perfect path into a real
  # branching maze with more than one way through. 0 keeps it a pure perfect maze (harder to get
  # lost with intent, since there's truly only one route); higher opens more of it up.
  extra-loop-chance: 0.04

  # Every Nth linked cell (in carve order) along a floor gets a wall torch, so a floor is
  # explorable without every corner being pitch dark.
  torch-interval: 6

# The block palette a floor's walls, floors, and ceilings are randomly drawn from -- real
# material names only; an unrecognized one is silently skipped. Deliberately mixed rather than
# one uniform block, so a carved floor doesn't look laid down in a single mechanical pass.
palette:
  walls: [COBBLESTONE, MOSSY_COBBLESTONE, STONE_BRICKS, MOSSY_STONE_BRICKS, CRACKED_STONE_BRICKS, DEEPSLATE_BRICKS]
  floor-accents: [GRAVEL, MOSS_BLOCK]
  floor-accent-chance: 0.05

# What a floor's dead ends can become, rolled independently per dead end (excluding whichever
# dead end that floor's own stairwell/boss room claims). If none of these hit, a dead end just
# stays an empty dead end -- not every corner of a huge maze needs to hide something.
rooms:
  treasure-chance: 0.35
  crypt-chance: 0.15
  prison-chance: 0.08
  trap-chance: 0.20
  chest-items-min: 2
  chest-items-max: 5

# Ordinary hostile mobs scattered through a floor's open corridors (not just dead ends) --
# roughly this many per 100 cells, so a bigger dungeon is proportionally more dangerous, not just
# bigger.
denizens:
  mobs: [ZOMBIE, SKELETON, SPIDER, CAVE_SPIDER, HUSK, SILVERFISH, WITCH]
  count-per-100-cells: 14

# The pressure-plate traps rooms.trap-chance scatters through dead ends -- real damage, no block
# damage ever (see DungeonProtectionListener's own doc comment for why that matters).
traps:
  damage-min: 3.0
  damage-max: 7.0
  ambush-mob-chance: 0.4
  cooldown-seconds: 5

# The one true boss, at the single farthest point (by real path distance, not straight-line) of
# the LAST floor -- a boosted real mob (health/damage multiplied via its actual Attribute values,
# not a separate "boss" mob type), a taller room than the rest of the maze, and a chest that
# doesn't even exist until this exact mob dies (see DungeonBossListener).
boss:
  base-type: WITHER_SKELETON
  name: "&4&lThe Depth Warden"
  health-multiplier: 6.0
  damage-multiplier: 2.5
  room-extra-height: 3
  chest-items-min: 4
  chest-items-max: 7

# Whether a newly created dungeon's entrance is sealed behind a key by default (see /dungeons key
# and DungeonEntranceListener). An admin gives a dungeon's key directly for now -- see README's
# roadmap note on a future drop/craft path.
keys:
  required-by-default: true

# Three independent weighted loot pools -- common (ordinary treasure-room chests), crypt (tomb/
# ruin-flavored rooms), and boss (the one chest behind the final fight). Each item needs a real
# material, a min/max stack amount, and a weight (higher rolls more often); a malformed entry is
# skipped with a logged warning, never fatal to the rest of the pool.
loot:
  common:
    items:
      - material: IRON_INGOT
        min: 1
        max: 4
        weight: 40
      - material: GOLD_INGOT
        min: 1
        max: 3
        weight: 25
      - material: BREAD
        min: 2
        max: 6
        weight: 35
      - material: ARROW
        min: 4
        max: 12
        weight: 30
      - material: EMERALD
        min: 1
        max: 3
        weight: 15
      - material: EXPERIENCE_BOTTLE
        min: 1
        max: 3
        weight: 10
  crypt:
    items:
      - material: GOLD_INGOT
        min: 1
        max: 4
        weight: 25
      - material: EMERALD
        min: 1
        max: 4
        weight: 20
      - material: BONE_MEAL
        min: 3
        max: 8
        weight: 20
      - material: ENDER_PEARL
        min: 1
        max: 2
        weight: 10
      - material: DIAMOND
        min: 1
        max: 1
        weight: 4
      - material: GOLDEN_APPLE
        min: 1
        max: 1
        weight: 3
  boss:
    items:
      - material: DIAMOND
        min: 2
        max: 5
        weight: 30
      - material: NETHERITE_INGOT
        min: 1
        max: 2
        weight: 10
      - material: EMERALD_BLOCK
        min: 1
        max: 2
        weight: 12
      - material: GOLDEN_APPLE
        min: 1
        max: 2
        weight: 10
      - material: DIAMOND_SWORD
        min: 1
        max: 1
        weight: 6
      - material: BOW
        min: 1
        max: 1
        weight: 8
